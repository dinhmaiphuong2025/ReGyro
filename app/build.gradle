plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fix.cfgyro'
    compileSdk 35
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId 'com.fix.cfgyro'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
            }
        }
    }

    signingConfigs {
        release {
            storeFile rootProject.file('keystore/regyro-release.jks')
            storePassword System.getenv('REGYRO_STORE_PASSWORD') ?: project.findProperty('REGYRO_STORE_PASSWORD')
            keyAlias 'regyro'
            keyPassword System.getenv('REGYRO_KEY_PASSWORD') ?: project.findProperty('REGYRO_KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = []
        }
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
