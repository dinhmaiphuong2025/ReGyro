plugins {
    id 'com.android.library'
}

android {
    namespace 'com.fix.cfgyro'
    compileSdk 35
    ndkVersion '26.3.11579264'

    defaultConfig {
        minSdk 26
        targetSdk 35

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
}

tasks.register('packageZygisk', Zip) {
    group = 'build'
    description = 'Package flashable Zygisk module zip for Magisk / KernelSU / APatch'
    dependsOn 'assembleRelease'

    archiveFileName = "ReGyro-v1.2.0-zygisk.zip"
    destinationDirectory = layout.buildDirectory.dir("outputs/zygisk")

    from("${rootDir}/template")

    doFirst {
        def tmpZygisk = file("${layout.buildDirectory.get().asFile}/tmp/zygisk")
        tmpZygisk.deleteDir()
        tmpZygisk.mkdirs()

        def bDir = layout.buildDirectory.get().asFile
        ['arm64-v8a', 'armeabi-v7a'].each { abi ->
            def candidates = fileTree(dir: bDir, include: "**/${abi}/**/libregyro.so").files
            def stripped = candidates.find { it.path.contains("stripped") }
            def soFile = stripped ?: candidates.find { it.exists() }
            if (soFile && soFile.exists()) {
                def target = new File(tmpZygisk, "${abi}.so")
                target.bytes = soFile.bytes
                println "Zygisk: packed ${abi}.so from ${soFile.path} (${soFile.length()} bytes)"
            } else {
                println "Zygisk: WARNING - no libregyro.so found for ${abi}"
            }
        }
    }

    into('zygisk') {
        from("${layout.buildDirectory.get().asFile}/tmp/zygisk")
    }
}

afterEvaluate {
    tasks.named('assembleRelease').configure {
        finalizedBy 'packageZygisk'
    }
}
